services:
  azurite:
    # Pin to an explicit version; update to latest release when upgrading.
    # Get digest: docker pull mcr.microsoft.com/azure-storage/azurite:3.36.0 && docker inspect ... --format='{{index .RepoDigests 0}}'
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10002:10002"

  basilisk:
    build:
      context: .
      dockerfile: docker/basilisk/Dockerfile
    env_file:
      - path: .env.test
        required: false
    environment:
      BASILISK_BASE_URL: http://localhost:8080
      BASILISK_DEV_APPROVE: "1"
      BASILISK_TOKEN_SECRET: ${BASILISK_TOKEN_SECRET:-ci-test-secret}
      BASILISK_UPLOAD_RATE_LIMIT_SEC: "0"
      BASILISK_UPLOAD_FPR_RATE_LIMIT_SEC: "0"
      BASILISK_SENDTOKEN_RATE_LIMIT_SEC: "0"
      # Notebook signalling against the local Web PubSub double, addressed the
      # same way the real service is — same connection-string shape, same
      # token, same subprotocol. `basilisk.serve` starts it because the
      # endpoint is loopback. The client is handed this URL verbatim, so the
      # port has to mean the same thing inside the container and out.
      AZURE_WEBPUBSUB_CONNECTION_STRING: "Endpoint=http://127.0.0.1:8081;AccessKey=ci-webpubsub-key;"
      BASILISK_WEBPUBSUB_HUB: notebook
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      - azurite
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  gpg-tester:
    build:
      context: .
      dockerfile: docker/gpg-tester/Dockerfile
    depends_on:
      basilisk:
        condition: service_healthy
