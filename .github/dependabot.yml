version: 2
updates:
  # GitHub Actions — opens PRs when pinned SHAs fall behind new releases
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-core:
        patterns:
          - "actions/*"
      actions-third-party:
        patterns:
          - "hashicorp/*"
          - "azure/*"
          - "anchore/*"
          - "pypa/*"

  # npm (frontend)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-all:
        patterns:
          - "*"

  # Python (pip-tools lockfile)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Docker base images
  - package-ecosystem: docker
    directory: /docker/basilisk
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Digest refreshes yes, Python version bumps no. This image has to run the
      # same interpreter the Function App does, and that is pinned at 3.13 by
      # `runtime_version` in terraform/modules/basilisk/functions.tf and by
      # `python-version` in ci.yml. A bump here would make the only place the
      # container is actually built -- the e2e job -- test a different Python
      # than production runs, and e2e builds on push to main rather than on a
      # pull request, so nothing would have failed until after the merge.
      # Raise all three together or none.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /docker/gpg-tester
    schedule:
      interval: weekly
      day: monday

  # Terraform providers
  - package-ecosystem: terraform
    directory: /terraform/cloudshell
    schedule:
      interval: monthly
