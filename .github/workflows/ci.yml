name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASILISK_TOKEN_SECRET: ${{ secrets.BASILISK_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Python vulnerability audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

      - name: Prepare environment files
        run: bash scripts/prepare-ci-env.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build portal
        working-directory: web
        run: |
          npm ci
          npm run build
      # vite strips types without reading them, so a green build says nothing
      # about whether the portal typechecks. Nothing ran tsc until this step:
      # that is how a used-but-never-imported symbol, a duplicate import and a
      # four-argument call to a three-argument function all reached main.
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck
      # The portal's own suite, which CI also never ran. Among it is
      # src/test/sources-parse.test.js, the guard on the step above: a file
      # that fails to parse stops tsc there and takes the whole repo out of
      # its report, leaving a red typecheck that looks like one small problem.
      - name: Test portal
        working-directory: web
        run: npm test
      - name: Node vulnerability audit
        working-directory: web
        run: npm audit --audit-level=moderate

      - run: python -m pytest tests/unit tests/integration -q --cov=basilisk --cov-report=term-missing

  sbom:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: basilisk.spdx.json
          upload-artifact: true
          artifact-name: basilisk-sbom-${{ github.sha }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudshell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive ..
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
