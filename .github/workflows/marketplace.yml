name: marketplace

on:
  push:
    paths:
      - marketplace/**
      - infra/**
  pull_request:
    paths:
      - marketplace/**
      - infra/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/package-marketplace.sh
      - run: az bicep build --file marketplace/mainTemplate.bicep
